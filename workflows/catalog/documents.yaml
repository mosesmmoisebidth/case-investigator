# Document catalog: every kind of document a bank, lender, landlord, insurer or
# account-opening team may ask for, worldwide.
#
# The intake sorter reads every page of every upload, scores it against this
# catalog and splits a mixed upload into separate documents.
#
# Fields per type
#   id         stable id
#   label      what the investigator sees
#   family     one of the families below
#   pack       the detailed pack in workflows/doctypes/ that reads its fields and
#              runs its checks; "generic" when no detailed pack exists yet
#   titles     phrases printed as the document's heading (strongest signal,
#              weighted higher near the top of the page). Lowercase, no accents.
#   keywords   phrases printed in the body (supporting signal)
#   starts     phrases that only appear on the first page of the document
#   signals    machine patterns: mrz_td3, mrz_td1, micr, iban, card_number, swift
#   not        phrases that rule this type out
#   max_pages  how many pages one document of this type normally has
#   used_for   kyc, account, loan, mortgage, rental, insurance, business, auto

families:
  identity: {label: Identity, order: 1}
  address: {label: Proof of address, order: 2}
  banking: {label: Bank accounts, order: 3}
  payment: {label: Payment instruments, order: 4}
  income: {label: Income and employment, order: 5}
  tax: {label: Tax, order: 6}
  assets: {label: Savings and investments, order: 7}
  credit: {label: Loans and credit, order: 8}
  property: {label: Property and housing, order: 9}
  business: {label: Business and company, order: 10}
  commerce: {label: Invoices and receipts, order: 11}
  insurance: {label: Insurance, order: 12}
  vehicle: {label: Vehicles, order: 13}
  civil: {label: Civil and legal records, order: 14}
  education: {label: Education, order: 15}
  forms: {label: Applications and forms, order: 16}
  other: {label: Other, order: 99}

